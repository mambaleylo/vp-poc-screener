# P/R's monthly retrain on GitHub's own machine (the user: "если у меня подписки не будет?" -> "пусть само сравнивает и принимает
# решение"): the 3rd of every month, 11:23 Moscow — the candles and the funding from data.binance.vision to the end of last month,
# the events, the deployed model reproduced, the new one trained (the last 24 months), the bot's test; tools/prv_audit/prv_decide.py
# accepts it only if every check holds -> vp_prv_model.json in main (the bot takes it within a day and says so in Telegram);
# otherwise nothing changes and an issue tells why. The log: tools/prv_audit/RETRAIN_LOG.md.
name: P/R monthly retrain
on:
  schedule:
    - cron: "23 8 3 * *"
  workflow_dispatch:
    inputs:
      end:
        description: "the last month of data, YYYY-MM (empty: last month)"
        required: false
      apply:
        description: "put an accepted model into main"
        type: boolean
        default: true
permissions:
  contents: write
  issues: write
concurrency:
  group: prv-retrain
  cancel-in-progress: false
jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      LABSTORE: /home/user/vp-lab-store
      PRV_OUT: /home/user/prv_month
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Libraries
        run: pip install -q numpy lightgbm numba scikit-learn flask requests
      - name: The lab's paths
        run: |
          sudo mkdir -p /home/user && sudo chown "$USER" /home/user
          ln -s "$GITHUB_WORKSPACE" /home/user/vp-poc-screener
          END="${{ github.event.inputs.end }}"; [ -n "$END" ] || END=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
          echo "END=$END" >> "$GITHUB_ENV"; echo "data to the end of $END"
      - name: Candles 1h (127 coins, data.binance.vision)
        working-directory: tools/ema_model
        run: END=$END python3 ../zones_model/dl.py 1h | tail -3
      - name: Funding, events, the deployed model reproduced, the new one trained
        working-directory: tools/prv_audit
        run: END=$END bash ./run_prv_month.sh
      - name: Decide
        id: dec
        working-directory: tools/prv_audit
        run: |
          set +e
          python3 prv_decide.py --apply 2>&1 | tee /tmp/decide.txt
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Into main
        if: ${{ github.event_name == 'schedule' || github.event.inputs.apply == 'true' }}
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/prv_audit/RETRAIN_LOG.md vp_prv_model.json
          if [ "${{ steps.dec.outputs.rc }}" = "0" ]; then MSG="P/R retrained to the end of $END (prv_decide.py: every check held)"; else MSG="P/R retrain $END not taken (prv_decide.py: see RETRAIN_LOG.md)"; fi
          git commit -q -m "$MSG" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 10; done
      - name: Tell why it was not taken
        if: ${{ steps.dec.outputs.rc != '0' && (github.event_name == 'schedule' || github.event.inputs.apply == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "P/R: переобучение за $END не принято" --body "$(tail -5 /tmp/decide.txt)

          Модель в боте не менялась. Журнал: tools/prv_audit/RETRAIN_LOG.md, запуск: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Tell it broke
        if: ${{ failure() && (github.event_name == 'schedule' || github.event.inputs.apply == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "P/R: переобучение за $END сломалось" --body "Один из шагов упал — модель в боте не менялась (бот продолжает со старой и напишет в Telegram, когда она устареет).

          Запуск: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
