# Тематики для автоматического поиска.
#
# Каждая тематика:
#   key          — короткий латинский идентификатор (не меняйте после первого запуска)
#   title        — название для отчётов
#   stems        — начала слов/фразы, по которым найденный запрос относится к тематике.
#                  Совпадение ищется с начала слова: "счет" найдёт «счета», «счетов».
#   seeds        — стартовые фразы, которые отправляются в источник как есть
#   core + modifiers — правила расширения: к каждой фразе из core добавляется
#                  каждый модификатор («генератор счетов» + «онлайн»).
#                  Если modifiers не указаны, берутся [expansion].commercial_modifiers.
#   product_hint — с какого типа продукта начинать гипотезу (для отчёта)
#
# Пишите фразы в нижнем регистре, без операторов Wordstat (+, !, "", []).

[expansion]
# Коммерческие модификаторы. Наличие такого слова — НЕ доказательство
# готовности платить, а только признак коммерческого намерения.
commercial_modifiers = [
    "цена", "стоимость", "купить", "заказать", "сервис", "программа", "онлайн",
    "аналог", "альтернатива", "автоматизация", "генератор", "калькулятор",
    "для бизнеса", "для магазина", "для маркетплейса",
]
# Сколько модификаторов на одну core-фразу использовать максимум
max_modifiers_per_core = 8

[filters]
# Запросы с этими словами (начала слов) отбрасываются как нерелевантные
exclude = [
    "торрент", "кряк", "crack", "keygen", "активатор", "ключ активации", "взлом",
    "ваканс", "резюме", "работа на дому", "реферат", "курсов", "диплом",
    "порно", "секс", "казино", "ставки на спорт", "гдз", "решебник",
]

