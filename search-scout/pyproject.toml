[project]
name = "search-scout"
version = "0.1.0"
description = "Telegram-бот для поиска идей цифровых продуктов по реальным поисковым сигналам"
readme = "README.md"
requires-python = ">=3.12"
# Точные версии: проект должен устанавливаться одинаково у всех.
# Полный список с транзитивными зависимостями — в requirements.txt.
dependencies = [
    "aiogram==3.31.0",
    "APScheduler==3.11.3",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.4",
    "snowballstemmer==3.1.1",
    "SQLAlchemy==2.1.4",
    "tzdata==2026.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: обращается к настоящему Wordstat API (нужны ключи и SCOUT_LIVE_TESTS=1)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# RUF001-003: в проекте много русского текста, «похожие» буквы — не ошибка.
ignore = ["RUF001", "RUF002", "RUF003"]
